<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu — Spice Plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>Today’s kitchen</h1>
        <p>Add items to your cart, then pay with GPay, Paytm, FamPay, or cash on delivery.</p>
      </div>
    </div>
    <div class="grid" id="menuGrid"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireAuth();
    if (session) {
      buildNav("menu");
      const grid = document.getElementById("menuGrid");
      const items = getMenu().filter((i) => i.available);
      grid.innerHTML = items.map((item) => `
        <article class="card">
          <img src="${item.image}" alt="${item.name}" />
          <div class="body">
            <h3>${item.name}</h3>
            <div class="price">${rupees(item.price)}</div>
            <div class="row">
              <button class="btn" data-add="${item.id}">Add to cart</button>
            </div>
          </div>
        </article>`).join("");
      grid.addEventListener("click", (e) => {
        const id = e.target.dataset.add;
        if (!id) return;
        const item = getMenu().find((i) => i.id === id);
        if (item) {
          addToCart(item);
          e.target.textContent = "Added";
          setTimeout(() => { e.target.textContent = "Add to cart"; }, 900);
        }
      });
    }
  </script>
</body>
</html>
