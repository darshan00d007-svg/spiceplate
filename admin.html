<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit products — Spice Plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>Edit products</h1>
        <p>Only <strong>darshan00d007@gmail.com</strong> can change names, prices, and availability.</p>
      </div>
    </div>
    <div id="root"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireAuth();
    if (session) {
      if (!isAdmin(session.email)) {
        document.getElementById("root").innerHTML = "<p class='empty'>This page is only for the owner account.</p>";
      } else {
        buildNav("admin");
        const root = document.getElementById("root");
        function render() {
          const items = getMenu();
          root.innerHTML = `
            <table class="admin-table">
              <thead><tr><th>Food</th><th>Price (₹)</th><th>On menu</th></tr></thead>
              <tbody>
                ${items.map((item, i) => `
                  <tr>
                    <td><input data-i="${i}" data-f="name" value="${item.name}" /></td>
                    <td><input data-i="${i}" data-f="price" type="number" min="1" value="${item.price}" /></td>
                    <td><input data-i="${i}" data-f="available" type="checkbox" ${item.available ? "checked" : ""} /></td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <p><button class="btn" id="saveBtn" type="button">Save changes</button></p>
            <p class="msg" id="msg"></p>`;
        }
        render();
        root.addEventListener("click", (e) => {
          if (e.target.id !== "saveBtn") return;
          const items = getMenu();
          root.querySelectorAll("input").forEach((input) => {
            const i = Number(input.dataset.i);
            const f = input.dataset.f;
            if (f === "available") items[i].available = input.checked;
            else if (f === "price") items[i].price = Number(input.value);
            else items[i].name = input.value.trim() || items[i].name;
          });
          saveMenu(items);
          document.getElementById("msg").textContent = "Saved. Customers will see the new names and prices.";
        });
      }
    }
  </script>
</body>
</html>
